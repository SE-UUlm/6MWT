<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow-head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <style>
    .bg        { fill: #ffffff; }
    .arrow-head { fill: #334155; }
    .edge      { stroke: #334155; fill: none; }

    .box-presentation { fill: #dbeafe; stroke: #2563eb; }
    .box-domain       { fill: #dcfce7; stroke: #16a34a; }
    .box-sensors      { fill: #fef3c7; stroke: #d97706; }
    .box-data         { fill: #ede9fe; stroke: #7c3aed; }

    .label-title { fill: #0f172a; font-size: 17px; font-weight: 700; }
    .label-sub   { fill: #334155; font-size: 13px; }
    .label-hint  { fill: #64748b; font-size: 12px; }

    @media (prefers-color-scheme: dark) {
      .bg        { fill: #0d1117; }
      .arrow-head { fill: #94a3b8; }
      .edge      { stroke: #94a3b8; }

      .box-presentation { fill: #1e3a5f; stroke: #3b82f6; }
      .box-domain       { fill: #14532d; stroke: #22c55e; }
      .box-sensors      { fill: #451a03; stroke: #f59e0b; }
      .box-data         { fill: #2e1065; stroke: #a855f7; }

      .label-title { fill: #f1f5f9; }
      .label-sub   { fill: #cbd5e1; }
      .label-hint  { fill: #94a3b8; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="860" height="530"/>

  <!-- Presentation Layer -->
  <rect class="box-presentation" x="180" y="30" width="500" height="100" rx="10" stroke-width="2"/>
  <text class="label-title" x="430" y="68"  text-anchor="middle">Presentation Layer</text>
  <text class="label-sub"   x="430" y="91"  text-anchor="middle">Flutter — screens, widgets, Riverpod UI providers</text>
  <text class="label-hint"  x="430" y="112" text-anchor="middle">May use: Domain, Sensors, Data</text>

  <!-- Domain Layer -->
  <rect class="box-domain" x="180" y="210" width="500" height="100" rx="10" stroke-width="2"/>
  <text class="label-title" x="430" y="248" text-anchor="middle">Domain Layer</text>
  <text class="label-sub"   x="430" y="271" text-anchor="middle">Pure Dart — application logic, Riverpod providers, no Flutter UI</text>
  <text class="label-hint"  x="430" y="292" text-anchor="middle">May use: Sensors, Data</text>

  <!-- Sensors -->
  <rect class="box-sensors" x="90" y="400" width="330" height="100" rx="10" stroke-width="2"/>
  <text class="label-title" x="255" y="438" text-anchor="middle">Sensors</text>
  <text class="label-sub"   x="255" y="461" text-anchor="middle">GPS and pedometer sources</text>
  <text class="label-hint"  x="255" y="482" text-anchor="middle">Platform integration, permission handling</text>

  <!-- Data Layer -->
  <rect class="box-data" x="440" y="400" width="330" height="100" rx="10" stroke-width="2"/>
  <text class="label-title" x="605" y="438" text-anchor="middle">Data Layer</text>
  <text class="label-sub"   x="605" y="461" text-anchor="middle">Drift/SQLite — profiles, sessions, raw samples</text>
  <text class="label-hint"  x="605" y="482" text-anchor="middle">Repositories and migrations</text>

  <!-- Arrows: A -> B means A may know B -->
  <line class="edge" x1="430" y1="130" x2="430" y2="204" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="350" y1="310" x2="278" y2="394" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="510" y1="310" x2="582" y2="394" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M 180 80 C 60 90, 45 270, 84 422" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M 680 80 C 800 90, 815 270, 776 422" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
