name: six_minute_walk_test
description: "Six-minute walk test with sensor-based distance measurement."
publish_to: "none"

version: 1.2.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.3
  go_router: ^16.0.0
  # drift_dev 2.34.0 uses preview APIs changed in drift 2.34.1.
  # Keep these pinned together until the analyzer/Riverpod upgrade.
  drift: 2.34.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  pedometer: ^4.2.0
  permission_handler: ^12.0.3
  logger: ^2.5.0
  share_plus: ^11.0.0
  intl: ^0.20.2
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  clock: ^1.1.2

  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.0
  riverpod_generator: ^4.0.4
  drift_dev: 2.34.0
  build_runner: ^2.15.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
