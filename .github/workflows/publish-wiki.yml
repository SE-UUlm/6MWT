name: Publish Wiki
on:
  push:
    branches: [main]
    paths:
      - wiki/**
      - .github/workflows/publish-wiki.yml
      - .github/scripts/prepare_wiki.py

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish-wiki:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Prepare Wiki links
        run: python3 .github/scripts/prepare_wiki.py wiki-publish

      - uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: wiki-publish
