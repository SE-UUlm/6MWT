name: Check for Broken Links
on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  check-for-broken-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Detect documentation and workflow changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          # Include earlier changes on feature branches so a later unrelated push
          # cannot bypass a failed link check. On the default branch, compare pushes.
          base: ${{ github.event.repository.default_branch }}
          filters: |
            docs:
              - 'wiki/**'
              - '**/*.md'
              - '**/*.markdown'
              - '**/*.mdown'
              - '**/*.mdx'
              - '.github/scripts/**'
              - '.github/workflows/publish-wiki.yml'
              - '.github/workflows/check-for-broken-links.yml'

      - name: No relevant changes
        if: steps.changes.outputs.docs == 'false'
        run: echo "No relevant changes; external link checking skipped."

      - name: Check links in all Markdown files
        if: steps.changes.outputs.docs != 'false'
        uses: becheran/mlc@v1
        with:
          args: --gitignore --markup-types md .
