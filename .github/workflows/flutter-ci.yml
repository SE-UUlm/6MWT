name: Flutter CI

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  changes:
    name: Detect check changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.app != 'false' }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect app and workflow changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Feature branches: compare all changes since branching from the default branch.
          # Default branch: compare with its state before this push.
          base: ${{ github.event.repository.default_branch }}
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/flutter-ci.yml'

  test:
    name: ${{ matrix.check.name }}
    needs: changes
    # Keep every named matrix check; run the checks if change detection fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Format
            command: dart format --output=none --set-exit-if-changed .
          - name: Analyze
            command: dart analyze
          - name: Test
            command: flutter test --no-pub

    steps:
      - name: No relevant changes
        if: needs.changes.outputs.relevant == 'false'
        working-directory: .
        run: echo "No app or CI workflow changes; check passed without running Flutter."

      - uses: actions/checkout@v6
        if: needs.changes.outputs.relevant != 'false'

      - name: Setup Flutter
        if: needs.changes.outputs.relevant != 'false'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-:os:-:arch:-:channel:-:version:-:hash:-${{ github.job }}
          pub-cache-key: flutter-pub-:os:-:arch:-:channel:-:version:-${{ hashFiles('app/pubspec.lock') }}

      - name: Install dependencies
        if: needs.changes.outputs.relevant != 'false'
        run: flutter pub get

      - name: ${{ matrix.check.name }}
        if: needs.changes.outputs.relevant != 'false'
        run: ${{ matrix.check.command }}
