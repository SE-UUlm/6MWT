name: Flutter Builds

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  changes:
    name: Detect build changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.app != 'false' }}
    steps:
      - name: Detect app and workflow changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # The PR file list includes all changes relative to its target branch.
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/flutter-builds.yml'
              - '.github/workflows/build-android.yml'
              - '.github/workflows/build-ios.yml'
              - '.github/flutter-version.yaml'
              - 'tools/release/**'

  build-android-pr:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.relevant != 'false' }}
    uses: ./.github/workflows/build-android.yml

  build-android-main:
    if: github.event_name == 'push'
    uses: ./.github/workflows/build-android.yml
    with:
      sign: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  build-ios:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.relevant != 'false') }}
    uses: ./.github/workflows/build-ios.yml

  pr-builds:
    name: PR builds
    needs: [changes, build-android-pr, build-ios]
    # Reusable jobs have different check names when skipped. Require this stable
    # check instead; it also reports failures from dependencies explicitly.
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check required build results
        working-directory: .
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          ANDROID_RESULT: ${{ needs.build-android-pr.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
        run: |
          if [ "$CHANGES_RESULT" != success ]; then
            echo 'Change detection did not succeed.'
            exit 1
          fi
          if [ "$RELEVANT" = false ]; then
            test "$ANDROID_RESULT" = skipped
            test "$IOS_RESULT" = skipped
            echo 'No relevant changes; mobile builds were not needed.'
          else
            test "$ANDROID_RESULT" = success
            test "$IOS_RESULT" = success
            echo 'Both mobile builds succeeded.'
          fi
