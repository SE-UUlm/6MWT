name: Build Visualizer

on:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Read shared version
        id: version
        run: python3 tools/release/version.py --output "$GITHUB_OUTPUT"

  desktop:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            archive: linux-x64.tar.gz
          - platform: windows
            runner: windows-2022
            archive: windows-x64.zip
          - platform: macos
            runner: macos-15
            archive: macos-universal.zip
    defaults:
      run:
        shell: bash
        working-directory: tools/6mwt_data_visualizer
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      ARCHIVE_SUFFIX: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .github/flutter-version.yaml
          cache: true
      - run: flutter pub get
      - name: Build desktop app
        env:
          PLATFORM: ${{ matrix.platform }}
        run: flutter build "$PLATFORM" --release --no-pub
      - name: Package Linux bundle
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/6mwt-visualizer-$RELEASE_VERSION-$ARCHIVE_SUFFIX" -C build/linux/x64/release/bundle .
      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/6mwt-visualizer-$env:RELEASE_VERSION-$env:ARCHIVE_SUFFIX"
      - name: Verify and package macOS bundle
        if: runner.os == 'macOS'
        run: |
          app_path="build/macos/Build/Products/Release/6MWT Visualizer.app"
          lipo "$app_path/Contents/MacOS/6MWT Visualizer" -verify_arch x86_64 arm64
          lipo "$app_path/Contents/Frameworks/App.framework/App" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$app_path"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "dist/6mwt-visualizer-$RELEASE_VERSION-$ARCHIVE_SUFFIX"
      - uses: actions/upload-artifact@v4
        with:
          name: visualizer-${{ matrix.platform }}
          path: tools/6mwt_data_visualizer/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

